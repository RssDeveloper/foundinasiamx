# netlify.toml - Configuración de Despliegue & Enrutamiento
[build]
  publish = "."

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

# Reescrituras transparentes para URLs limpias sin .html (200 OK)
[[redirects]]
  from = "/the-finds"
  to = "/the-finds.html"
  status = 200

[[redirects]]
  from = "/personal-sourcing"
  to = "/personal-sourcing.html"
  status = 200

[[redirects]]
  from = "/destinations"
  to = "/destinations.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/politica-de-privacidad"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/aviso-de-privacidad"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/cookies"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/404"
  to = "/404.html"
  status = 200

[[redirects]]
  from = "/500"
  to = "/500.html"
  status = 200

# Redirecciones canónicas forzadas 301 para URLs con extensión .html
[[redirects]]
  from = "/the-finds.html"
  to = "/the-finds"
  status = 301
  force = true

[[redirects]]
  from = "/personal-sourcing.html"
  to = "/personal-sourcing"
  status = 301
  force = true

[[redirects]]
  from = "/destinations.html"
  to = "/destinations"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/privacy.html"
  to = "/privacy"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/404.html"
  to = "/404"
  status = 301
  force = true

[[redirects]]
  from = "/500.html"
  to = "/500"
  status = 301
  force = true

# Fallback 404 para cualquier ruta no encontrada
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Cabeceras de seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
